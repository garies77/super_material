# Tes otomatis + deploy ke shared hosting lewat SSH. Panduan lengkap: DEPLOY.md
#
# Alur:
#   1. Setiap push / pull request: semua tes dijalankan, ditambah uji migrasi + cadangan/pulih di MariaDB.
#   2. Hanya push ke main (atau tombol "Run workflow" dari main untuk versi yang sudah ada di main) yang di-deploy,
#      dan hanya setelah semua tes lulus.
#   3. Kode produksi dikemas menjadi satu arsip lalu dikirim lewat SSH (.env & storage/ tidak pernah disentuh).
#   4. Di server: mode pemeliharaan, arsip dibongkar, lalu `deploy:finish` (cadangan database bila ada migrasi baru,
#      migrasi, cache, buka situs). Situs hanya tertutup beberapa detik.
#   5. Workflow mengecek halaman situs dan memastikan berkas rahasia tidak bisa diakses publik.
#
# Rollback: Actions -> "Tes & deploy" -> Run workflow (branch main) -> isi kode commit versi lama yang ada di main.
# Darurat : Actions -> "Darurat: buka mode pemeliharaan".

name: Tes & deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Versi yang di-deploy: kode commit / tag yang sudah ada di main (untuk rollback isi kode commit versi lama)'
        required: true
        default: main

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'
  PHP_EXTENSIONS: mbstring, intl, gd, zip, bcmath, exif, fileinfo, pdo_sqlite, sqlite3, pdo_mysql

jobs:
  test:
    name: Tes otomatis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Database jenis yang sama dengan shared hosting, untuk menguji migrasi dan cadangan/pulih sungguhan
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: supermaterial_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pasang paket PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Rakit aset (Vite)
        run: npm ci && npm run build

      - name: Siapkan .env tes
        run: cp .env.example .env && php artisan key:generate

      - name: Jalankan tes
        run: php artisan test --compact

      - name: Uji migrasi + cadangan/pulih database di MariaDB
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: supermaterial_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact --filter="writes a gzip SQL backup that restores the data"

      # Informasi saja (tidak menghentikan deploy): celah keamanan yang diketahui pada paket PHP
      - name: Audit keamanan paket
        run: composer audit --locked
        continue-on-error: true

  deploy:
    name: Deploy ke hosting
    needs: test
    # Hanya dari branch main: push (setelah merge) atau Run workflow yang dijalankan dari main
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # Satu deploy dalam satu waktu; deploy berikutnya menunggu, tidak membatalkan yang sedang berjalan
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      # Sidik jari kunci host ED25519 (hPanel -> SSH Access): koneksi ditolak bila yang menjawab bukan server kita
      SSH_HOST_FINGERPRINT: ${{ vars.SSH_HOST_FINGERPRINT }}
      SSH_PHP: ${{ vars.SSH_PHP || '/opt/alt/php84/usr/bin/php' }}
      # Folder proyek (berisi artisan) relatif dari folder home akun hosting, diakhiri /
      APP_DIR: ${{ vars.FTP_SERVER_DIR }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Periksa pengaturan
        run: |
          missing=""
          for name in SSH_HOST SSH_PRIVATE_KEY SSH_PORT SSH_USER SSH_HOST_FINGERPRINT APP_DIR SITE_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Pengaturan belum diisi:$missing (lihat DEPLOY.md bagian Pengaturan GitHub)"
            exit 1
          fi
          case "$APP_DIR" in */) ;; *) echo "::error::FTP_SERVER_DIR harus diakhiri tanda /"; exit 1 ;; esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Pastikan versi ini sudah ada di main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Versi $(git rev-parse --short HEAD) belum masuk ke branch main. Hanya versi yang sudah di-merge ke main yang boleh di-deploy."
            exit 1
          fi

      - name: Siapkan SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" 2>/dev/null > "$RUNNER_TEMP/host_key"
          actual=$(ssh-keygen -lf "$RUNNER_TEMP/host_key" | awk '{print $2}')
          if [ "$actual" != "$SSH_HOST_FINGERPRINT" ]; then
            echo "::error::Sidik jari server SSH (${actual:-tidak terbaca}) tidak cocok dengan SSH_HOST_FINGERPRINT. Situs TIDAK disentuh."
            exit 1
          fi
          cat "$RUNNER_TEMP/host_key" >> ~/.ssh/known_hosts
          {
            echo "Host hosting"
            echo "  HostName $SSH_HOST"
            echo "  Port $SSH_PORT"
            echo "  User $SSH_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  ServerAliveInterval 15"
          } > ~/.ssh/config
          ssh hosting "test -f '${APP_DIR}artisan'" || { echo "::error::${APP_DIR}artisan tidak ditemukan di server. Situs TIDAK disentuh."; exit 1; }

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Rakit kode produksi
        run: |
          # .env sementara hanya untuk skrip composer (package:discover, filament:upgrade); tidak ikut dikirim
          cp .env.example .env
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          npm ci && npm run build
          rm -f .env
          echo "RELEASE=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Tidak pernah dikirim (jadi tidak pernah ditimpa di server): .env, storage/ (foto produk, unggahan, log,
      # cadangan), symlink public/storage, cache config/route milik server di bootstrap/cache
      - name: Kemas arsip rilis
        run: |
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            --exclude=./.git --exclude='./.git*' --exclude=./node_modules --exclude=./.github --exclude=./.claude \
            --exclude=./.env --exclude='./.env.*' --exclude=./.editorconfig --exclude=./.mcp.json --exclude=./.npmrc \
            --exclude='./*.md' --exclude=./boost.json --exclude=./phpunit.xml --exclude=./package.json \
            --exclude=./package-lock.json --exclude=./vite.config.js --exclude=./RELEASE --exclude=./scratch \
            --exclude=./tests --exclude=./storage --exclude=./public/storage --exclude=./public/hot \
            --exclude=./bootstrap/cache/config.php --exclude='./bootstrap/cache/routes-*.php' --exclude=./bootstrap/cache/events.php \
            .
          ls -lh "$RUNNER_TEMP/release.tar.gz"

      - name: Kirim arsip
        run: |
          ssh hosting "mkdir -p ~/deploy-releases"
          scp -q "$RUNNER_TEMP/release.tar.gz" "hosting:deploy-releases/$RELEASE.tar.gz"

      # Situs tertutup hanya selama arsip dibongkar + deploy:finish (cadangan database bila ada migrasi baru, migrasi,
      # cache, buka situs). Bila deploy:finish gagal, situs sengaja tetap dalam pemeliharaan agar data aman.
      - name: Pasang rilis
        id: install
        run: |
          ssh hosting "RELEASE='$RELEASE' APP_DIR='$APP_DIR' PHP='$SSH_PHP' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/"$APP_DIR"
          mkdir -p storage/framework
          echo '{"except":[],"redirect":null,"retry":60,"refresh":null,"secret":null,"status":503,"template":null}' > storage/framework/down
          tar -xzf ~/deploy-releases/"$RELEASE".tar.gz -C .
          echo "$RELEASE" > RELEASE
          "$PHP" artisan deploy:finish --force
          # Simpan 3 arsip terbaru untuk rollback cepat
          ls -1t ~/deploy-releases/*.tar.gz | tail -n +4 | xargs -r rm -f
          REMOTE

      - name: Cek halaman situs
        run: |
          failed=0
          for path in /up / /produk /artikel "/cari?q=semen" /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${SITE_URL%/}$path")
            echo "$code  $path"
            [ "$code" = "200" ] || failed=1
          done
          # Berkas rahasia/teknis tidak boleh bisa diunduh dari internet
          for path in /.env /RELEASE /composer.json /storage/logs/laravel.log /storage/app/deploy/status.json /vendor/autoload.php; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${SITE_URL%/}$path")
            echo "$code  $path (harus bukan 200)"
            [ "$code" != "200" ] || { echo "::error::$path bisa diakses publik! Periksa document root (DEPLOY.md)."; failed=1; }
          done
          [ $failed -eq 0 ] || { echo "::error::Pemeriksaan situs setelah deploy gagal."; exit 1; }

      - name: Petunjuk bila gagal
        if: failure() || cancelled()
        run: |
          {
            echo "### Deploy $RELEASE tidak selesai"
            if [ "${{ steps.install.outcome }}" = "failure" ]; then
              echo "Situs kemungkinan masih dalam **mode pemeliharaan** (data aman)."
            else
              echo "Situs **tidak disentuh** atau sudah terbuka kembali."
            fi
            echo ""
            echo "- Perbaiki lalu push lagi ke main, **atau** rollback: Run workflow (branch main) dengan kode commit versi sebelumnya."
            echo "- Darurat: Actions -> \"Darurat: buka mode pemeliharaan\" (juga menampilkan log server)."
            echo "- Detail: DEPLOY.md bagian Jika deploy gagal."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ringkasan
        if: success()
        run: |
          {
            echo "### Deploy $RELEASE selesai"
            echo "- Versi: \`${{ inputs.ref || github.ref_name }}\` ($RELEASE)"
            echo "- Situs: $SITE_URL"
            echo "- Rollback: Run workflow (branch main) -> isi kode commit versi sebelumnya"
          } >> "$GITHUB_STEP_SUMMARY"
